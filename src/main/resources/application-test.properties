# test profile - activated by @ActiveProfiles("test") on the shared test base classes.
#
# Deliberately empty, for the same reason as application-dev.properties: nothing differs
# from the shared base. MongoDB in particular must not be configured here - integration
# tests get their connection from Testcontainers @ServiceConnection, which overrides these
# properties at runtime, so a value here would be silently ignored.
#
# Add a property here only when it genuinely differs from application.properties.
