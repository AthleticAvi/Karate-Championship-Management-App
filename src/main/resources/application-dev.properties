# dev profile - set by mvn spring-boot:run, through spring-boot.run.profiles in pom.xml.
#
# Add a property here only when it genuinely differs from application.properties.

# The local replica set from the README, so a clean clone needs nothing set.
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/?replicaSet=rs0}

# The default address of a local development server.
cors.allowed-origins=http://localhost:5173

# The API description, at /v3/api-docs, with no login. Not in prod: it would hand anyone a map of
# every write.
springdoc.api-docs.enabled=true

# A clean clone starts with no variables set: it warns instead, and nobody can sign in.
accounts.first-admin.required=false
