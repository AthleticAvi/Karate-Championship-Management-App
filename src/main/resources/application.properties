# Shared by every profile. No profile applies by itself: com.management.config.StartupSettingsCheck
# refuses to start without one. Differences live in application-dev.properties and
# application-prod.properties, beside this file.

# The rules a match is run by. Bound and validated by com.management.config.GameProperties;
# suffixed values arrive as java.time.Duration.
game.default-duration=120s
game.optional-durations=90s,180s

# The score a fighter must cross to win. A trigger, not a cap: crossing 8 with an IPPON
# from 7 finishes the match at 10.
game.winning-points=8

# Fouls that end the match against the fighter who committed them.
game.fouls-ending-match=4

# Time a referee may add to compensate for a clock stopped late.
game.clock-increments=10s,30s

# Which database to use. Where the datastore is differs per profile: see spring.mongodb.uri in the
# profile files. The database is set apart because a hosted URI usually names none, and the driver
# would then use "test".
spring.mongodb.database=${MONGO_DB:kumitedb}

# The longest one datastore operation may take, retries included. Write concern is not here: it
# is fixed in com.management.config.DatastoreConfiguration, so no environment can weaken it.
datastore.operation-timeout=10s

# How long opening one connection may take, and how long an operation may wait for a usable server,
# so a lost datastore fails fast. A socket timeout is not here: the operation timeout replaces it.
# Heartbeats inherit the connect timeout, so a low value marks a slow hosted member as lost.
datastore.connect-timeout=10s
datastore.server-selection-timeout=5s

# How long startup waits for the datastore to answer before treating it as unreachable.
datastore.startup-wait=5s

# Request size. The container has no limit on a JSON body, so the Jackson limit is the one that
# counts, in bytes. The form and multipart readers are off: no endpoint takes either, and the form
# filter reads a PUT body whole, past every limit here.
spring.jackson.factory.constraints.read.max-document-length=65536
spring.mvc.formcontent.filter.enabled=false
spring.servlet.multipart.enabled=false
server.max-http-request-header-size=8KB
server.tomcat.max-http-form-post-size=64KB

# How much of a refused body is read and thrown away so the caller still gets the answer. Past this
# the connection closes.
server.tomcat.max-swallow-size=2MB

# How long a connection may sit silent during a request, and between requests. The second stays
# above the 60s idle timeout common in proxies, so a proxy never reuses a connection closing here.
server.tomcat.connection-timeout=20s
server.tomcat.keep-alive-timeout=75s

# Forwarded headers are ignored until a deployment names its proxy. Set FORWARD_HEADERS_STRATEGY to
# native and TRUSTED_PROXIES to its addresses, as CIDR ranges or a regular expression. With native
# alone, nothing is trusted. Never use framework: it believes the headers from any caller.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:}

# On shutdown, finish what is running and stop waiting after this long. Room for a normal request
# and a slow datastore operation, under the 30s a platform commonly allows before killing the
# process. It does not cover a request retrying through a datastore outage.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Browser origins allowed to call the API, as exact origins. None by default, so a deployment refuses
# every other origin until it names one in CORS_ALLOWED_ORIGINS, comma separated.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# The generated API description. Off here, so it is served only where a profile turns it on.
springdoc.api-docs.enabled=false
springdoc.default-produces-media-type=application/json
springdoc.model-converters.java-nullable-property-customizer.enabled=true
springdoc.open-api.info.title=Karate Championship Management API
springdoc.open-api.info.version=v1

# The first Admin, used only when no Admin exists. Neither value has a default in any profile: blank
# means not set. With no Admin and either one missing, startup is refused while required is true.
accounts.first-admin.username=${ADMIN_USERNAME:}
accounts.first-admin.password=${ADMIN_PASSWORD:}
accounts.first-admin.required=true

# Actuator: expose only health and info over HTTP, on the main port. Only the liveness and readiness
# groups are public: see com.management.security.SecurityConfiguration.
management.endpoints.web.exposure.include=health,info

# Health detail names the database user, hosts and disk paths, so only an Admin sees it. The public
# groups answer with their overall status alone.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN

# Every request needs the datastore, so an instance that cannot reach it is not ready.
management.endpoint.health.group.readiness.include=readinessState,mongo

# Text logs show the correlation ID and the fields of the request line. Structured output carries
# both anyway and ignores this: see application-prod.properties.
logging.pattern.correlation=[%X{correlationId:-}] %kvp\u0020

# The framework's line for a refused method repeats what the client sent, and the request line
# already records the 405.
logging.level.org.springframework.web.servlet.PageNotFound=ERROR

# The driver's INFO line at client start prints the database username.
logging.level.org.mongodb.driver.client=WARN
