# The profile that applies when none is set, so a clean clone runs with no extra steps.
# Overrides live in application-dev.properties, beside this file, and in the test profile's
# application-test.properties under src/test/resources - test config is kept off the runtime
# classpath. Both are currently empty, because nothing yet differs from this shared base.
spring.profiles.default=dev

# The rules a match is run by. Bound and validated by com.management.config.GameProperties;
# suffixed values arrive as java.time.Duration.
game.default-duration=120s
game.optional-durations=90s,180s

# The score a fighter must cross to win. A trigger, not a cap: crossing 8 with an IPPON
# from 7 finishes the match at 10.
game.winning-points=8

# Fouls that end the match against the fighter who committed them.
game.fouls-ending-match=4

# Time a referee may add to compensate for a clock stopped late.
game.clock-increments=10s,30s

# Where the datastore is. Credentials and TLS arrive inside MONGO_URI, from the environment, and
# never in a file. The database is set apart because a hosted URI usually names none, and the
# driver would then use "test".
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/?replicaSet=rs0}
spring.mongodb.database=${MONGO_DB:kumitedb}

# The longest one datastore operation may take, retries included. Write concern is not here: it
# is fixed in com.management.config.DatastoreConfiguration, so no environment can weaken it.
datastore.operation-timeout=10s

# How long opening one connection may take, and how long an operation may wait for a usable server,
# so a lost datastore fails fast. A socket timeout is not here: the operation timeout replaces it.
# Heartbeats inherit the connect timeout, so a low value marks a slow hosted member as lost.
datastore.connect-timeout=10s
datastore.server-selection-timeout=5s

# How long startup waits for the datastore to answer before treating it as unreachable.
datastore.startup-wait=5s

# Actuator: expose only health and info over HTTP.
management.endpoints.web.exposure.include=health,info

# Health detail names the database user, hosts and disk paths, so only an authorised caller sees it.
# With no security yet, that is nobody: health reports its overall status alone.
management.endpoint.health.show-details=when-authorized

# The driver's INFO line at client start prints the database username.
logging.level.org.mongodb.driver.client=WARN
