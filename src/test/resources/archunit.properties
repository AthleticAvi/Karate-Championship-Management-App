# The frozen architecture violations are committed, and only change on purpose. A missing store, a
# new or reworded rule, and a fixed violation all fail the build rather than silently rewriting the
# store. To accept a change: mvn test -Dtest=ArchitectureTest
# -Darchunit.freeze.store.default.allowStoreUpdate=true, then commit the store.
freeze.store.default.path=config/archunit/frozen
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
