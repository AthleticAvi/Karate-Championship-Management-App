# test profile - activated by @ActiveProfiles("test") on the shared test base classes.
#
# Lives in src/test/resources, not src/main/resources, so it stays on the test classpath and
# never reaches the packaged jar. `test` is not a runtime profile: there is no environment
# where the application should be started under it, and a copy in the jar would invite exactly
# that.
#
# Deliberately empty. Nothing differs from the shared base yet, and inventing a difference just
# to fill the file would duplicate a key and let the two copies drift. MongoDB in particular
# must not be set here - integration tests get their connection from Testcontainers
# @ServiceConnection, which overrides these properties at runtime, so a value here would be
# silently ignored.
#
# Add a property here only when it genuinely differs from application.properties.
