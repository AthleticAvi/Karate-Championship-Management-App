name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. `pull_request` already runs fork code without repository
# secrets and with a read-only token; this pins it explicitly.
# Never switch this workflow to `pull_request_target` -- that trigger grants
# secrets to code from forks. This is not hypothetical: the usual workaround
# for "my code-analysis service can't see fork PRs" is exactly that switch,
# and it is the reason SonarQube Cloud was rejected for this repo rather than
# worked around. Most PRs here come from forks.
permissions:
  contents: read

# A new push to a branch cancels the run still in flight for it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # the commit message check reads the whole PR range

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn -B --no-transfer-progress verify

      # After the build, so one badly worded commit never hides the test results.
      - name: Check commit messages
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! java src/test/java/com/management/docs/CommitMessageCheck.java --reject-autosquash "$RUNNER_TEMP/message"; then
              echo "commit $sha breaks the rule above"
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
          if-no-files-found: ignore
          retention-days: 7

      # Merged coverage across both suites. Browse index.html from the artifact.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: '**/target/site/jacoco/*'
          if-no-files-found: ignore
          retention-days: 7
